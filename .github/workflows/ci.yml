name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: bash -n scripts/build-mac.sh scripts/verify-mac.sh
      - run: swiftc -typecheck -framework AppKit macos/MultiplayerCodex.swift
